<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talks — Tim Lytle</title>
  <meta name="description" content="Every conference talk Tim Lytle has given since {{FIRST_YEAR}}: {{TALK_COUNT}} talks, {{DELIVERY_COUNT}} deliveries. APIs, testing, Docker, daemons, ownership, and a few yaks. Slides and ratings where they exist.">
  <meta property="og:title" content="Talks — Tim Lytle">
  <meta property="og:description" content="{{TALK_COUNT}} talks, {{DELIVERY_COUNT}} deliveries, since {{FIRST_YEAR}}. Slides, abstracts, and where to rate them.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://timlytle.net/talks.html">
  <meta property="og:image" content="https://timlytle.net/assets/img/og-talks.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@tjlytle">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Roboto+Condensed:wght@300;500;700&family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>

  <header class="container">
    <nav class="nav" aria-label="Primary">
      <a class="nav__brand" href="/" aria-label="Tim Lytle, home">
        <span class="nav__name">Tim Lytle</span>
        <span class="nav__handle">@tjlytle</span>
      </a>
      <ul class="nav__links">
        <li><a href="/#about">About</a></li>
        <li><a href="/talks.html" aria-current="page">Talks</a></li>
        <li><a href="/#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">

    <section class="section" style="padding-top:56px" aria-labelledby="talks-title">
      <div class="section__head">
        <div>
          <h1 class="display section__title" id="talks-title" style="font-size:clamp(3rem,7vw,6rem)">Things I've<br><b>Talked About</b></h1>
        </div>
        <a class="hand talks__cta" href="/#contact"><span class="hand--yellow">Want one at your event?</span><span class="hand--green">Let's talk →</span></a>
      </div>
      {{UPCOMING}}
      <p class="hand hand--green section__kicker" style="margin-bottom:20px">Notable talks</p>
      <div class="talk-grid">{{FEATURED_CARDS}}
      </div>
    </section>

    <section class="section" aria-labelledby="all-title">
      <div class="section__head">
        <h2 class="display section__title" id="all-title"><b>All the talks</b>.</h2>
      </div>
      <div class="sheet sticky sticky--tape">
        <ol class="list">{{TALK_LIST}}
        </ol>
      </div>
    </section>

  </main>

  <footer class="container">
    <div class="footer">
      <ul class="footer__links">
        <li><a href="https://linkedin.com/in/timlytle" target="_blank" rel="noopener">LinkedIn</a></li>
        <li><a href="https://joind.in/user/tjlytle/talks" target="_blank" rel="noopener">joind.in</a></li>
        <li><a href="https://github.com/tjlytle" target="_blank" rel="noopener">GitHub</a></li>
      </ul>
    </div>
  </footer>

  <script>
    // Parallax: the wash layer is 140vh tall and slides at 12% of scroll speed, clamped to its overhang.
    (function () {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var root = document.documentElement, queued = false;
      function update() {
        var vh = innerHeight, max = vh * 0.2;
        var shift = Math.max(-max, Math.min(max, max - scrollY * 0.12));
        root.style.setProperty('--wash-shift', shift + 'px');
        queued = false;
      }
      addEventListener('scroll', function () { if (!queued) { queued = true; requestAnimationFrame(update); } }, { passive: true });
      addEventListener('resize', update);
      update();
    })();
  </script>
</body>
</html>
